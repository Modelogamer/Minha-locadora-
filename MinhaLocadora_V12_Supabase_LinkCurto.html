<body>
<header><h1>🎬 Minha Locadora</h1><div class="sub">★ SUA LOCADORA VIRTUAL ★ COLEÇÃO DE BLU-RAYS ★</div></header>

<script>
const key="minhaLocadoraV2";
let items=JSON.parse(localStorage.getItem(key)||"null")||[];
let isSharedView=false;
let filter="all";
const cfg=JSON.parse(localStorage.getItem("locadora_api_cfg")||"{}");

function save(){localStorage.setItem(key,JSON.stringify(items))}
function esc(s){return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function cardHtml(x){return `<div class="card" onclick="openDetail(${x.id})"><img src="${x.img||''}" onerror="this.style.visibility='hidden'"><div class="info"><div class="title">${esc(x.title)}</div><div class="meta">${x.year||"—"} • ${esc(x.format||"")}</div>${x.owned?'<span class="badge">NA COLEÇÃO</span>':x.wish?'<span class="badge" style="background:#3b2d0b;color:#ffd34e">QUERO COMPRAR</span>':''}</div></div>`}
function norm(s){return (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function hasGenre(x,terms){const genres=String(x.genre||"").split(",").map(v=>norm(v).trim()).filter(Boolean);return terms.some(t=>genres.includes(norm(t).trim()))}
function migrateCollection(){
  let changed=false;
  items.forEach(x=>{
    const title=norm(x.title);
    if(title==="por agua abaixo" && x.format!=="DVD"){
      x.format="DVD";
      changed=true;
    }
    if(title==="cidade dos anjos" && x.genre!=="Romance"){
      x.genre="Romance";
      changed=true;
    }
  });
  if(changed) save();
}
const heroWords=["marvel","dc comics","dc","vingadores","avengers","homem-aranha","homem aranha","spider-man","spider man","batman","superman","super-homem","mulher-maravilha","wonder woman","liga da justiça","justice league","x-men","x men","deadpool","venom","thor","homem de ferro","iron man","capitão américa","captain america","pantera negra","black panther","guardiões da galáxia","guardians of the galaxy","homem-formiga","ant-man","quarteto fantástico","fantastic four","aquaman","flash","shazam","esquadrão suicida","suicide squad","coringa","joker","doutor estranho","doctor strange","capitã marvel","captain marvel","eternos","eternals","viúva negra","black widow","gavião arqueiro","hawkeye","demolidor","daredevil","blade","lâmina","hellboy","spawn"];
function isHeroMovie(x){const t=norm(x.title);return heroWords.some(w=>t.includes(norm(w)))}
// Franquias com vários filmes devem permanecer na mesma prateleira.
// A regra da franquia vem antes da classificação individual do TMDB.
const franchiseGenres={
  ficcao:["avatar","matrix","blade runner","guerra nas estrelas","star wars","jogos vorazes","the hunger games","alien","predator","exterminador do futuro","terminator","planeta dos macacos","planet of the apes","jurassic"],
  aventura:["piratas do caribe","pirates of the caribbean","indiana jones","jumanji","transformers","missao impossivel","mission impossible","homem aranha","homem-aranha","spider-man","batman","superman"],
  acao:["velozes e furiosos","fast & furious","john wick","rambo","duro de matar","die hard","007","james bond"]
};
function franchiseGenre(x){
  if(x.type!=="movie")return null;
  const t=norm(x.title);
  for(const [genre,words] of Object.entries(franchiseGenres)){
    if(words.some(w=>t.includes(norm(w))))return genre;
  }
  return null;
}
const genrePriority=[
 {key:"acao",title:"Ação",emoji:"💥",terms:["Ação","Action"]},
 {key:"terror",title:"Terror",emoji:"👻",terms:["Terror","Horror"]},
 {key:"animacao",title:"Animação",emoji:"🧸",terms:["Animação","Animation"]},
 {key:"ficcao",title:"Ficção científica",emoji:"🚀",terms:["Ficção científica","Science Fiction","Sci-Fi"]},
 {key:"comedia",title:"Comédia",emoji:"😂",terms:["Comédia","Comedy"]},
 {key:"aventura",title:"Aventura",emoji:"🗺️",terms:["Aventura","Adventure"]},
 {key:"fantasia",title:"Fantasia",emoji:"🧙",terms:["Fantasia","Fantasy"]},
 {key:"suspense",title:"Suspense",emoji:"🔪",terms:["Suspense","Thriller"]},
 {key:"crime",title:"Crime",emoji:"🕵️",terms:["Crime"]},
 {key:"drama",title:"Drama",emoji:"🎭",terms:["Drama"]},
 {key:"romance",title:"Romance",emoji:"❤️",terms:["Romance"]}
];
function primaryGenre(x){if(x.type==="movie"&&isHeroMovie(x))return "aventura";const franchise=franchiseGenre(x);if(franchise)return franchise;const found=genrePriority.find(g=>hasGenre(x,g.terms));return found?found.key:"outros"}
function shelf(title,emoji,list){const arr=list.filter(x=>primaryGenre(x)===title);if(!arr.length)return '';return `<section class="shelf"><div class="shelfhead"><h2>${emoji} ${title}</h2><span>${arr.length} ${arr.length===1?'filme':'filmes'} • deslize →</span></div><div class="shelfrow">${arr.map(cardHtml).join('')}</div></section>`}
function renderShelves(list){
 const movies=list.filter(x=>x.type==="movie");
 const ownedMovies=movies.filter(x=>x.owned&&!x.wish);
 const wishMovies=movies.filter(x=>x.wish);
 const shelves=genrePriority.map(g=>{const arr=ownedMovies.filter(x=>primaryGenre(x)===g.key);if(!arr.length)return "";return `<section class="shelf"><div class="shelfhead"><h2>${g.emoji} ${g.title}</h2><span>${arr.length} ${arr.length===1?"filme":"filmes"} • deslize →</span></div><div class="shelfrow">${arr.map(cardHtml).join("")}</div></section>`}).join("");
 const outros=ownedMovies.filter(x=>primaryGenre(x)==="outros");
 const otherShelf=outros.length?`<section class="shelf"><div class="shelfhead"><h2>🎞️ Outros</h2><span>${outros.length} ${outros.length===1?"filme":"filmes"} • deslize →</span></div><div class="shelfrow">${outros.map(cardHtml).join("")}</div></section>`:"";
 const wishShelves=genrePriority.map(g=>{const arr=wishMovies.filter(x=>primaryGenre(x)===g.key);if(!arr.length)return "";return `<section class="shelf wish-shelf"><div class="shelfhead"><h2>🛒 ${g.title}</h2><span>${arr.length} ${arr.length===1?"filme":"filmes"} • deslize →</span></div><div class="shelfrow">${arr.map(cardHtml).join("")}</div></section>`}).join("");
 const wishOutros=wishMovies.filter(x=>primaryGenre(x)==="outros");
 const wishOtherShelf=wishOutros.length?`<section class="shelf wish-shelf"><div class="shelfhead"><h2>🛒 Outros</h2><span>${wishOutros.length} ${wishOutros.length===1?"filme":"filmes"} • deslize →</span></div><div class="shelfrow">${wishOutros.map(cardHtml).join("")}</div></section>`:"";
 const wishTitle=wishMovies.length?`<div class="store-sign" style="margin-top:4px">🛒 QUERO COMPRAR • FILMES QUE AINDA PROCURO</div>`:"";
 return shelves+otherShelf+wishTitle+wishShelves+wishOtherShelf||'<div class="empty">Ainda não há filmes com gênero cadastrado. Adicione filmes pela busca para criar as prateleiras automaticamente.</div>';
}
function render(){
 const q=document.getElementById("search").value.toLowerCase();
 const list=items.filter(x=>(filter==="all"||(filter==="movie"&&x.type==="movie")||(filter==="game"&&x.type==="game")||(filter==="wish"&&x.wish))&&x.title.toLowerCase().includes(q));
 document.getElementById("movieCount").textContent=items.filter(x=>x.type==="movie"&&x.owned&&!x.wish).length;
 document.getElementById("gameCount").textContent=items.filter(x=>x.type==="game"&&x.owned).length;
 document.getElementById("wishCount").textContent=items.filter(x=>x.wish).length;
 const grid=document.getElementById("grid");
 if(filter==="all"&&!q){grid.className="shelves";grid.innerHTML=renderShelves(list);return}
 grid.className="grid";
 grid.innerHTML=list.length?list.map(cardHtml).join(""):'<div class="empty">Nenhum título encontrado.</div>';
}
function bytesToBase64(bytes){let binary="";const chunk=0x8000;for(let i=0;i<bytes.length;i+=chunk){binary+=String.fromCharCode(...bytes.subarray(i,i+chunk));}return btoa(binary).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/g,"");}
function base64ToBytes(str){str=str.replace(/-/g,"+").replace(/_/g,"/");while(str.length%4)str+="=";const binary=atob(str);const bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);return bytes;}

// Compartilhamento curto via Supabase.
// A publishable key pode ser usada no navegador; a secret/service key NUNCA deve ser colocada aqui.
const SUPABASE_URL="https://xtwpgqvvjdjwasvvltqo.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_VyRk-Yuow_YV96uz5aZ3IQ_eNkgKJx0";

async function encodeSharedCollection(){
  const payload=JSON.stringify({app:"Minha Locadora",version:12,createdAt:new Date().toISOString(),items});
  const data=new TextEncoder().encode(payload);
  if("CompressionStream" in window){
    const cs=new CompressionStream("gzip");
    const writer=cs.writable.getWriter();writer.write(data);writer.close();
    const buf=new Uint8Array(await new Response(cs.readable).arrayBuffer());
    return "g1."+bytesToBase64(buf);
  }
  return "p1."+bytesToBase64(data);
}
async function decodeSharedCollection(encoded){
  try{
    const [kind,data]=encoded.split(".",2);if(!data)return null;
    let bytes=base64ToBytes(data);
    if(kind==="g1"){
      if(!("DecompressionStream" in window))return null;
      const ds=new DecompressionStream("gzip");const writer=ds.writable.getWriter();writer.write(bytes);writer.close();bytes=new Uint8Array(await new Response(ds.readable).arrayBuffer());
    }else if(kind!=="p1")return null;
    const payload=JSON.parse(new TextDecoder().decode(bytes));
    return Array.isArray(payload.items)?payload.items:null;
  }catch(e){return null;}
}

async function supabaseRequest(path,options={}){
  const headers={
    "apikey":SUPABASE_PUBLISHABLE_KEY,
    "Authorization":"Bearer "+SUPABASE_PUBLISHABLE_KEY,
    "Content-Type":"application/json",
    ...(options.headers||{})
  };
  const res=await fetch(SUPABASE_URL+path,{...options,headers});
  if(!res.ok){
    let msg="Erro no Supabase ("+res.status+")";
    try{const body=await res.json();if(body&&body.message)msg=body.message;else if(body&&body.error)msg=body.error;}catch(_){ }
    throw new Error(msg);
  }
  return res;
}
function randomShareId(){
  const chars="ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789";
  const bytes=new Uint8Array(8);crypto.getRandomValues(bytes);
  let out="";for(let i=0;i<8;i++)out+=chars[bytes[i]%chars.length];
  return out;
}
async function createSupabaseShare(){
  const compressed=await encodeSharedCollection();
  const payload={app:"Minha Locadora",version:12,createdAt:new Date().toISOString(),encoded:compressed};
  for(let attempt=0;attempt<5;attempt++){
    const shareId=randomShareId();
    try{
      await supabaseRequest("/rest/v1/shared_collections",{
        method:"POST",
        headers:{"Prefer":"return=minimal"},
        body:JSON.stringify({share_id:shareId,payload})
      });
      return shareId;
    }catch(e){
      if(!String(e.message).toLowerCase().includes("duplicate")&&!String(e.message).includes("23505"))throw e;
    }
  }
  throw new Error("Não foi possível gerar um código de compartilhamento único.");
}
async function importSharedFromHash(){
  const hash=location.hash||"";
  const shortMatch=hash.match(/^#s=([A-Za-z0-9_-]{6,16})$/);
  if(shortMatch){
    try{
      const id=encodeURIComponent(shortMatch[1]);
      const res=await supabaseRequest("/rest/v1/shared_collections?select=payload&share_id=eq."+id+"&limit=1",{method:"GET"});
      const rows=await res.json();
      const record=rows&&rows[0];
      if(!record||!record.payload)throw new Error("Coleção compartilhada não encontrada.");
      const encoded=record.payload.encoded||record.payload.data||"";
      return await decodeSharedCollection(encoded);
    }catch(e){
      alert("⚠️ Não foi possível abrir esta coleção compartilhada.\n\n"+e.message);
      return null;
    }
  }
  // Compatibilidade: links antigos da V11 continuam funcionando.
  const oldMatch=hash.match(/^#view=(.+)$/);
  if(oldMatch)return await decodeSharedCollection(decodeURIComponent(oldMatch[1]));
  return null;
}
async function shareCollection(){
  if(isSharedView)return;
  try{
    if(location.protocol!=="http:"&&location.protocol!=="https:"){
      alert("⚠️ O aplicativo ainda está aberto como arquivo local.\n\nPublique a V12 no GitHub Pages para gerar links compartilháveis.");
      return;
    }
    const shareId=await createSupabaseShare();
    const link=location.href.split("#")[0]+"#s="+shareId;
    if(navigator.share){await navigator.share({title:"Minha Locadora",text:"🎬 Veja minha coleção de filmes e jogos — somente visualização",url:link});}
    else{await navigator.clipboard.writeText(link);alert("✅ Link curto da sua locadora copiado!\n\nCódigo: "+shareId+"\n\nA pessoa poderá visualizar sua coleção sem alterar nada.");}
  }catch(e){if(e.name!=="AbortError")alert("Não foi possível gerar o link: "+e.message);}
}
function enableReadOnly(){
  document.body.classList.add("readonly");
  document.getElementById("visitorBanner").style.display="block";
  document.getElementById("searchHint").textContent="Pesquise somente dentro da coleção compartilhada.";
  const api=document.getElementById("apiBtn");if(api)api.style.display="none";
  document.querySelectorAll(".card").forEach(c=>c.setAttribute("aria-label","Somente visualização"));
}
async function apiSearch(){
 const q=document.getElementById("search").value.trim();
 if(!q)return;
 if(!cfg.tmdb && !cfg.rawg){settings();return}
 let results=[];
 document.getElementById("grid").innerHTML='<div class="empty">🔎 Procurando informações...</div>';
 try{
   if(cfg.tmdb){const r=await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${encodeURIComponent(cfg.tmdb)}&language=pt-BR&query=${encodeURIComponent(q)}`); if(r.ok){const d=await r.json();results.push(...d.results.slice(0,8).map(x=>({source:"TMDB",type:"movie",title:x.title,year:(x.release_date||"").slice(0,4),img:x.poster_path?`https://image.tmdb.org/t/p/w500${x.poster_path}`:"",synopsis:x.overview||"Sinopse não disponível."})));}}
   if(cfg.rawg){const r=await fetch(`https://api.rawg.io/api/games?key=${encodeURIComponent(cfg.rawg)}&search=${encodeURIComponent(q)}&page_size=8`); if(r.ok){const d=await r.json();results.push(...d.results.map(x=>({source:"RAWG",type:"game",title:x.name,year:(x.released||"").slice(0,4),img:x.background_image||"",synopsis:"Descrição detalhada será carregada ao abrir o resultado."})));}}
   showApiResults(results,q);
 }catch(e){document.getElementById("grid").innerHTML='<div class="empty">Não foi possível consultar as APIs. Verifique suas chaves e a conexão.</div>'}
}
function showApiResults(results,q){
 const box=results.length?results.map((x,i)=>{const exists=items.some(a=>a.type===x.type&&a.title.toLowerCase()===x.title.toLowerCase());return `<div class="result"><img src="${x.img}" onerror="this.style.visibility='hidden'"><div class="grow"><b>${esc(x.title)}</b><div class="meta">${x.year||"—"} • ${x.type==="movie"?"Filme":"Jogo"} • ${x.source}</div><div class="${exists?'ok':'warn'}">${exists?'✓ VOCÊ JÁ TEM ESTE TÍTULO':'Novo título'}</div></div>${exists?'<button disabled>Já tenho</button>':`<button class="primary" onclick='addApi(${JSON.stringify(x).replace(/'/g,"&#39;")})'>Adicionar</button>`}</div>`}).join(""):'<div class="empty">Nenhum resultado encontrado.</div>';
 document.getElementById("grid").innerHTML=box;
}
async function addApi(x){
 let obj={id:Date.now(),type:x.type,title:x.title,year:x.year,genre:"",format:x.type==="movie"?"Blu-ray":"PS5",owned:true,wish:false,rating:null,rarityScore:null,rarityNote:"",img:x.img,synopsis:x.synopsis};
 if(x.type==="movie" && cfg.tmdb){
   try{const r=await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${encodeURIComponent(cfg.tmdb)}&language=pt-BR&query=${encodeURIComponent(x.title)}`);const d=await r.json();const m=d.results?.[0];if(m){const det=await fetch(`https://api.themoviedb.org/3/movie/${m.id}?api_key=${encodeURIComponent(cfg.tmdb)}&language=pt-BR`).then(a=>a.json());obj.synopsis=det.overview||obj.synopsis;obj.genre=(det.genres||[]).map(g=>g.name).join(", ");obj.year=(det.release_date||obj.year||"").slice(0,4);}}catch(e){}}
 if(x.type==="game" && cfg.rawg){try{const d=await fetch(`https://api.rawg.io/api/games?key=${encodeURIComponent(cfg.rawg)}&search=${encodeURIComponent(x.title)}&page_size=1`).then(a=>a.json());const g=d.results?.[0];if(g){obj.genre=(g.genres||[]).map(a=>a.name).join(", ");obj.year=(g.released||obj.year||"").slice(0,4);obj.img=g.background_image||obj.img;}}catch(e){}}
 items.push(obj);save();document.getElementById("search").value="";render();alert("Adicionado à sua coleção!");
}
function rarityLabel(score){if(score===null||score===undefined||score==="")return "Ainda não avaliado";score=Number(score);if(score>=9)return "Extremamente raro";if(score>=7.5)return "Muito raro";if(score>=5)return "Raro";if(score>=2.5)return "Pouco raro";return "Comum"}
function rarityColor(score){score=Number(score);return score>=7.5?"#ffd34e":score>=5?"#ff9f43":"#aaa"}
function rarityHtml(x){const score=x.rarityScore;return `<div style="margin:14px 0;padding:14px;border:1px solid #3b3b3b;border-radius:14px;background:#171717"><h3 style="margin:0 0 8px">💎 Raridade do Blu-ray</h3><div style="font-size:22px;font-weight:800;color:${score!==null&&score!==undefined&&score!==""?rarityColor(score):"#aaa"}">${score!==null&&score!==undefined&&score!==""?`<span>${score}/10</span> • ${rarityLabel(score)}`:"Ainda não avaliado"}</div><p style="margin:8px 0 0;color:#bbb;font-size:13px">Estimativa baseada em disponibilidade, status fora de catálogo (OOP), procura entre colecionadores e características da edição. Não é um preço de mercado nem uma avaliação oficial.</p>${x.rarityNote?`<p style="margin:8px 0 0"><b>Observação:</b> ${esc(x.rarityNote)}</p>`:""}${isSharedView?"":`<div class="actions" style="margin-top:10px"><button onclick="editRarity(${x.id})">✏️ Avaliar raridade</button></div>`}</div>`}
function openDetail(id){
 const x=items.find(a=>a.id===id);
 document.getElementById("modalBody").innerHTML=`<div class="detail"><img src="${x.img||''}"><div><h2>${esc(x.title)}</h2><div class="meta">${x.year||"—"} • ${esc(x.genre||"")}<br>${esc(x.format||"")}</div>${x.rating?`<p>⭐ Minha nota: <b>${x.rating}/10</b></p>`:""}${x.type==="movie"&&norm(x.format)==="blu-ray"?rarityHtml(x):""}<h3>Sinopse</h3><p>${esc(x.synopsis||"Sinopse ainda não cadastrada.")}</p><div class="actions">${isSharedView?"":(x.owned?`<button class="primary" onclick="moveToWish(${x.id})">🛒 Mover para Quero comprar</button>`:x.wish?`<button class="primary" onclick="moveToCollection(${x.id})">🎬 Voltar para Minha coleção</button>`:"" )}${isSharedView?"":`<button onclick="removeItem(${x.id})">🗑 Remover</button>`}<button onclick="closeModal()">Fechar</button></div></div></div>`;
 document.getElementById("modal").classList.add("show");
}
function editRarity(id){const x=items.find(a=>a.id===id);if(!x)return;document.getElementById("modalBody").innerHTML=`<h2>💎 Avaliar raridade</h2><p><b>${esc(x.title)}</b></p><label>Pontuação de raridade (0 a 10)</label><input id="rarityScore" type="number" min="0" max="10" step="0.1" value="${x.rarityScore??""}" placeholder="Ex.: 8.5"><label>Observação da comunidade/colecionadores</label><textarea id="rarityNote" rows="4" placeholder="Ex.: edição nacional fora de catálogo, difícil de encontrar usado..."></textarea><p><small>Use a pontuação como índice de raridade, não como valor financeiro. A raridade pode mudar conforme novas edições e a oferta no mercado.</small></p><div class="actions"><button class="primary" onclick="saveRarity(${x.id})">Salvar avaliação</button><button onclick="openDetail(${x.id})">Cancelar</button></div>`;document.getElementById("rarityNote").value=x.rarityNote||"";}
function saveRarity(id){const x=items.find(a=>a.id===id);if(!x)return;let v=document.getElementById("rarityScore").value.trim();if(v!==""){v=Math.max(0,Math.min(10,Number(v)));if(Number.isNaN(v))v="";}x.rarityScore=v===""?null:v;x.rarityNote=document.getElementById("rarityNote").value.trim();save();openDetail(id);}
function moveToWish(id){const x=items.find(a=>a.id===id);if(!x)return;x.wish=true;x.owned=false;save();closeModal();render();if(filter!=="wish"){filter="wish";document.querySelectorAll(".tab").forEach(a=>a.classList.toggle("active",a.dataset.filter==="wish"));render();}}
function moveToCollection(id){const x=items.find(a=>a.id===id);if(!x)return;x.wish=false;x.owned=true;save();closeModal();render();} 
function toggleWish(id){moveToWish(id)}
function removeItem(id){items=items.filter(x=>x.id!==id);save();closeModal();render()}
function closeModal(){document.getElementById("modal").classList.remove("show")}
function settings(){
 document.getElementById("modalBody").innerHTML=`<h2>⚙️ Conectar bases de dados</h2>
 <p>Para a V3 funcionar com dados reais, informe suas chaves de API. Elas ficam salvas apenas neste navegador no protótipo.</p>
 <label>TMDB API Key (filmes)</label><input id="tmdbKey" value="${esc(cfg.tmdb||"")}" placeholder="Cole sua chave TMDB">
 <p><small>O TMDB oferece dados e imagens de filmes; para uso não comercial, a API é gratuita com atribuição, conforme os termos atuais.</small></p>
 <label>RAWG API Key (jogos)</label><input id="rawgKey" value="${esc(cfg.rawg||"")}" placeholder="Cole sua chave RAWG">
 <p><small>A RAWG exige uma chave em cada requisição e tem plano gratuito para uso pessoal, com atribuição e limites.</small></p>
 <div class="actions"><button class="primary" onclick="saveCfg()">Salvar chaves</button><button onclick="closeModal()">Fechar</button></div>`;
 document.getElementById("modal").classList.add("show");
}
function saveCfg(){localStorage.setItem("locadora_api_cfg",JSON.stringify({tmdb:document.getElementById("tmdbKey").value.trim(),rawg:document.getElementById("rawgKey").value.trim()}));Object.assign(cfg,JSON.parse(localStorage.getItem("locadora_api_cfg")));closeModal();alert("Configuração salva!");}
document.getElementById("search").addEventListener("keydown",e=>{if(e.key==="Enter")apiSearch()});
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(a=>a.classList.remove("active"));b.classList.add("active");filter=b.dataset.filter;render()});
(async function initApp(){
  const shared=await importSharedFromHash();
  if(shared){items=shared;isSharedView=true;}
  migrateCollection();
  render();
  if(isSharedView)enableReadOnly();
})();
</script>

<script>
(function(){
  function exportCollectionBackup(){
    try{
      const keys=[];
      for(let i=0;i<localStorage.length;i++) keys.push(localStorage.key(i));
      const storage={};
      keys.forEach(k=>storage[k]=localStorage.getItem(k));
      const backup={
        app:"Minha Locadora",
        type:"localStorage-backup",
        version:1,
        createdAt:new Date().toISOString(),
        localStorage:storage
      };
      const blob=new Blob([JSON.stringify(backup,null,2)],{type:"application/json"});
      const url=URL.createObjectURL(blob);
      const a=document.createElement("a");
      a.href=url;
      a.download="minha-locadora-backup.json";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),1000);
      alert("Backup criado! Procure pelo arquivo minha-locadora-backup.json na pasta de downloads.");
    }catch(e){ alert("Não foi possível criar o backup: "+e.message); }
  }
  function importCollectionBackup(){
    const input=document.createElement("input");
    input.type="file";
    input.accept=".json,application/json";
    input.onchange=async()=>{
      const file=input.files&&input.files[0];
      if(!file)return;
      try{
        const fileText=await file.text();
        const backup=JSON.parse(fileText);
        if(!backup || backup.type!=="localStorage-backup" || !backup.localStorage){
          throw new Error("Este não parece ser um backup válido da Minha Locadora.");
        }
        const savedItems=backup.localStorage["minhaLocadoraV2"];
        if(!savedItems){
          throw new Error("O arquivo não contém a coleção da Minha Locadora.");
        }
        const parsedItems=JSON.parse(savedItems);
        if(!Array.isArray(parsedItems)){
          throw new Error("A coleção encontrada no backup é inválida.");
        }

        const movieCount=parsedItems.filter(x=>x.type==="movie" && x.owned && !x.wish).length;
        const gameCount=parsedItems.filter(x=>x.type==="game" && x.owned).length;
        const wishCount=parsedItems.filter(x=>x.wish).length;

        const ok=confirm(
          "📥 BACKUP ENCONTRADO!\n\n"+
          "Coleção: "+movieCount+" filmes • "+gameCount+" jogos • "+wishCount+" para comprar.\n\n"+
          "Ao continuar, os dados atuais deste navegador serão substituídos pelo backup.\n\n"+
          "Deseja restaurar agora?"
        );
        if(!ok)return;

        Object.entries(backup.localStorage).forEach(([k,v])=>{
          if(v!==null && v!==undefined) localStorage.setItem(k,v);
        });

        alert(
          "✅ COLEÇÃO RESTAURADA!\n\n"+
          movieCount+" filmes\n"+
          gameCount+" jogos\n"+
          wishCount+" itens em Quero comprar\n\n"+
          "O aplicativo será recarregado."
        );
        location.reload();
      }catch(e){
        alert("❌ Não foi possível restaurar.\n\n"+e.message+"\n\nSelecione o arquivo minha-locadora-backup.json.");
      }
    };
    input.click();
  }

  function addRecoveryButton(){
    if(document.getElementById("recoveryBackupWrap")) return;
    const wrap=document.createElement("div");
    wrap.id="recoveryBackupWrap";
    wrap.style.cssText="position:fixed;right:12px;bottom:14px;z-index:999999;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end";

    const backup=document.createElement("button");
    backup.textContent="📦 Fazer backup";
    backup.onclick=exportCollectionBackup;
    backup.style.cssText="padding:13px 16px;border:1px solid #f5a623;border-radius:14px;background:#241007;color:#ffd34e;font-size:15px;font-weight:700;box-shadow:0 4px 18px #000;cursor:pointer";

    const restore=document.createElement("button");
    restore.textContent="📥 Restaurar backup";
    restore.title="Selecione o arquivo minha-locadora-backup.json para recuperar sua coleção";
    restore.onclick=importCollectionBackup;
    restore.style.cssText="padding:13px 16px;border:1px solid #55aaff;border-radius:14px;background:#071827;color:#7fc8ff;font-size:15px;font-weight:700;box-shadow:0 4px 18px #000;cursor:pointer";

    wrap.appendChild(backup);
    wrap.appendChild(restore);
    document.body.appendChild(wrap);
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",addRecoveryButton);
  else addRecoveryButton();
})();
</script>
</body></html>
